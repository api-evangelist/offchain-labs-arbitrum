aid: offchain-labs-arbitrum
name: Offchain Labs (Arbitrum)
description: >-
  Offchain Labs is the team behind Arbitrum, a suite of Ethereum Layer 2 scaling
  technologies (Arbitrum One and Arbitrum Nova) built on the Nitro tech stack and
  the AnyTrust and Rollup protocols. Rather than a traditional REST API, Arbitrum
  exposes an Ethereum-compatible JSON-RPC interface plus Arbitrum-specific
  precompiles and the NodeInterface, and ships first-party developer tooling: the
  TypeScript Arbitrum SDK for bridging and cross-chain messaging, the Orbit SDK
  for launching custom Arbitrum chains, and the Stylus SDK (Rust/Wasm) with the
  cargo-stylus CLI for writing EVM-compatible smart contracts. This profile was
  seeded as a pantera-capital portfolio lead and enriched from Arbitrum's public
  developer surface.
